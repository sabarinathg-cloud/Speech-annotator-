services:
  backend:
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./apps/backend:/app
      - backend_uploads:/app/data/uploads
      - ./sample_data/audio:/app/data/uploads/sample-audio:ro
    ports:
      - "8000:8000"

  worker:
    volumes:
      - ./apps/backend:/app
      - backend_uploads:/app/data/uploads
      - ./sample_data/audio:/app/data/uploads/sample-audio:ro

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: deps
    working_dir: /workspace/apps/frontend
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./apps/frontend:/workspace/apps/frontend
      - ./packages/shared-types:/workspace/packages/shared-types
      - frontend_node_modules:/workspace/apps/frontend/node_modules
    ports:
      - "3000:3000"

volumes:
  frontend_node_modules:

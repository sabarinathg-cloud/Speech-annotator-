services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-outcomes_annotator}
      POSTGRES_USER: ${POSTGRES_USER:-outcomes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outcomes_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outcomes_user} -d ${POSTGRES_DB:-outcomes_annotator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      args:
        INSTALL_ALIGNMENT_DEPS: ${INSTALL_ALIGNMENT_DEPS:-true}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://outcomes_user:outcomes_password@postgres:5432/outcomes_annotator}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-local-access-secret}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-dev-local-refresh-secret}
      AUDIO_SIGNING_SECRET: ${AUDIO_SIGNING_SECRET:-dev-local-audio-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JOBS_INLINE: ${JOBS_INLINE:-false}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      HIRING_AUDIO_IMPORT_ROOTS: ${HIRING_AUDIO_IMPORT_ROOTS:-/mnt/amc-data}
      HF_HOME: ${HF_HOME:-/app/.cache/huggingface}
      PII_MODEL_PRELOAD_ENABLED: ${PII_MODEL_PRELOAD_ENABLED:-false}
      AUTO_SEED_DEV_USERS: ${AUTO_SEED_DEV_USERS:-true}
    volumes:
      - backend_uploads:/app/data/uploads
      - ${HIRING_AUDIO_HOST_DIR:-/home/ubuntu/amc-data}:${HIRING_AUDIO_CONTAINER_DIR:-/mnt/amc-data}:ro
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/backend
      args:
        INSTALL_ALIGNMENT_DEPS: ${INSTALL_ALIGNMENT_DEPS:-true}
    restart: unless-stopped
    command: ["python", "/app/scripts/worker.py"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://outcomes_user:outcomes_password@postgres:5432/outcomes_annotator}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-local-access-secret}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-dev-local-refresh-secret}
      AUDIO_SIGNING_SECRET: ${AUDIO_SIGNING_SECRET:-dev-local-audio-secret}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JOBS_INLINE: "false"
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      HIRING_AUDIO_IMPORT_ROOTS: ${HIRING_AUDIO_IMPORT_ROOTS:-/mnt/amc-data}
      HF_HOME: ${HF_HOME:-/app/.cache/huggingface}
    volumes:
      - backend_uploads:/app/data/uploads
      - ${HIRING_AUDIO_HOST_DIR:-/home/ubuntu/amc-data}:${HIRING_AUDIO_CONTAINER_DIR:-/mnt/amc-data}:ro
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  huggingface_cache:
